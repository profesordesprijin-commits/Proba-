<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b3a6b">
<title>Învață Matematica</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #1b3a6b;
  --card: #264a85;
  --fg: #ffffff;
  --muted: #b9c9e6;
  --accent: #ffd23f;
  --accent-fg: #1b2a4a;
  --good: #3ecf8e;
  --bad: #ff6b6b;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  display: flex;
  flex-direction: column;
  align-items: center;
}
main { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 18px; flex: 1; }
.top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 1.05rem; font-weight: 600; }
.top b { color: var(--accent); }
.bar { height: 10px; background: var(--card); border-radius: 99px; overflow: hidden; }
.bar > div { height: 100%; width: 0%; background: var(--accent); transition: width .3s; }
.question {
  background: var(--card);
  border-radius: 24px;
  padding: 32px 12px;
  text-align: center;
  font-size: 3.4rem;
  font-weight: 800;
  letter-spacing: .02em;
  font-variant-numeric: tabular-nums;
}
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.answers button {
  font: inherit;
  font-size: 2.2rem;
  font-weight: 800;
  min-height: 92px;
  border: 0;
  border-radius: 20px;
  background: var(--accent);
  color: var(--accent-fg);
  cursor: pointer;
}
.answers button:active { transform: scale(.97); }
.answers button.good { background: var(--good); }
.answers button.bad { background: var(--bad); }
.answers button:disabled { cursor: default; }
.end { text-align: center; display: none; flex-direction: column; gap: 16px; align-items: center; margin-top: 24px; }
.end .stars { font-size: 3rem; letter-spacing: .1em; color: var(--accent); }
.end h1 { margin: 0; font-size: 2rem; }
.end p { margin: 0; color: var(--muted); font-size: 1.15rem; }
.again { font: inherit; font-size: 1.4rem; font-weight: 800; padding: 18px 36px; border: 0; border-radius: 20px; background: var(--accent); color: var(--accent-fg); cursor: pointer; }
.install { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.install[hidden] { display: none; }
.install button { font: inherit; font-size: 1.3rem; font-weight: 800; min-height: 64px; border: 0; border-radius: 18px; background: var(--good); color: #0b2a1d; cursor: pointer; }
.install p { margin: 0; color: var(--muted); font-size: 1rem; text-align: center; }
button:focus-visible { outline: 4px solid #fff; outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .bar > div { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="install" id="install" hidden>
    <button type="button" id="installBtn">Instalează jocul pe telefon</button>
    <p id="installHelp" hidden>Apasă cele 3 puncte din colțul de sus al Chrome, apoi alege „Instalează aplicația" sau „Adaugă pe ecranul principal".</p>
  </div>
  <div class="top"><span id="qn">Întrebarea 1 din 10</span><span>Puncte: <b id="score">0</b></span></div>
  <div class="bar"><div id="fill"></div></div>

  <div id="game" style="display:flex;flex-direction:column;gap:18px">
    <div class="question" id="question" aria-live="polite">3 + 4</div>
    <div class="answers" id="answers"></div>
  </div>

  <div class="end" id="end">
    <div class="stars" id="stars"></div>
    <h1 id="endTitle">Bravo!</h1>
    <p id="endText"></p>
    <button class="again" id="again" type="button">Mai joc o dată</button>
  </div>
</main>

<script>
(function () {
  var TOTAL = 10;
  var current = 0, score = 0, locked = false, correct = 0;

  var qn = document.getElementById("qn");
  var scoreEl = document.getElementById("score");
  var fill = document.getElementById("fill");
  var qEl = document.getElementById("question");
  var aEl = document.getElementById("answers");
  var game = document.getElementById("game");
  var end = document.getElementById("end");

  function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

  function makeQuestion() {
    var plus = Math.random() < 0.5;
    var a, b, ans;
    if (plus) { a = rnd(1, 12); b = rnd(1, 20 - a); ans = a + b; }
    else { a = rnd(5, 20); b = rnd(1, a); ans = a - b; }
    var opts = [ans];
    while (opts.length < 4) {
      var d = rnd(-4, 4);
      var v = ans + d;
      if (d !== 0 && v >= 0 && opts.indexOf(v) === -1) opts.push(v);
    }
    opts.sort(function () { return Math.random() - 0.5; });
    return { text: a + (plus ? " + " : " − ") + b, ans: ans, opts: opts };
  }

  function show() {
    locked = false;
    var q = makeQuestion();
    qn.textContent = "Întrebarea " + (current + 1) + " din " + TOTAL;
    fill.style.width = (current / TOTAL * 100) + "%";
    qEl.textContent = q.text + " = ?";
    aEl.innerHTML = "";
    q.opts.forEach(function (v) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = v;
      b.addEventListener("click", function () { pick(b, v, q); });
      aEl.appendChild(b);
    });
  }

  function pick(btn, v, q) {
    if (locked) return;
    locked = true;
    var buttons = aEl.querySelectorAll("button");
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].disabled = true;
      if (Number(buttons[i].textContent) === q.ans) buttons[i].classList.add("good");
    }
    if (v === q.ans) { score += 10; correct++; scoreEl.textContent = score; }
    else { btn.classList.add("bad"); }
    setTimeout(function () {
      current++;
      if (current >= TOTAL) finish(); else show();
    }, 900);
  }

  function finish() {
    fill.style.width = "100%";
    game.style.display = "none";
    end.style.display = "flex";
    var s = correct >= 9 ? 3 : correct >= 6 ? 2 : 1;
    document.getElementById("stars").textContent = "★★★".slice(0, s) + "☆☆☆".slice(0, 3 - s);
    document.getElementById("endTitle").textContent = correct >= 9 ? "Excelent!" : correct >= 6 ? "Bravo!" : "Încearcă din nou!";
    document.getElementById("endText").textContent = "Ai răspuns corect la " + correct + " din " + TOTAL + " întrebări.";
  }

  document.getElementById("again").addEventListener("click", function () {
    current = 0; score = 0; correct = 0;
    scoreEl.textContent = "0";
    end.style.display = "none";
    game.style.display = "flex";
    show();
  });

  show();

  // Buton de instalare
  var installBox = document.getElementById("install");
  var installBtn = document.getElementById("installBtn");
  var installHelp = document.getElementById("installHelp");
  var deferred = null;
  var standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone;
  if (!standalone) installBox.hidden = false;

  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferred = e;
  });
  window.addEventListener("appinstalled", function () {
    installBox.hidden = true;
  });
  installBtn.addEventListener("click", function () {
    if (deferred) {
      deferred.prompt();
      deferred.userChoice.then(function (r) {
        deferred = null;
        if (r && r.outcome === "accepted") installBox.hidden = true;
      });
    } else {
      installHelp.hidden = false;
    }
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
